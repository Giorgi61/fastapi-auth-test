services:

    app:
        build: .
        container_name: app-fastapi
        env_file:
            - .env
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 8000
        ports:
            - 8000:8000
        networks:
            - app-network

        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine

        restart: unless-stopped

        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}


        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            app-network:
                aliases:
                    - db
                    - database

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

networks:
    app-network:
        driver: bridge

volumes:
    postgres-data:
        driver: local
